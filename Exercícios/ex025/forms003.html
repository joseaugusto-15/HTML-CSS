<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="" method="get">
        <label for="nome">Nome: </label>
        <input type="text" name="nome" id="nome" required maxlength="30" placeholder="Nome Completo" autocomplete="name">

        <label for="media">Média: </label>
        <input type="number" name="media" id="media" min="0" max="10" step="0.1" required value="5">

        <label for="mes">Período letivo: </label>
        <input type="month" name="mes" id="mes" value="2020-07">

        <label for="dia">Dia da prova: </label>
        <input type="date" name="dia" id="dia" value="2020-07-14">

        <label for="hora">Horário da prova: </label>
        <input type="time" name="hora" id="hora">

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
