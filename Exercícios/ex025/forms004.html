<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de formulários</h1>
    <form action="" method="get" autocomplete="on">
        <!-- Agrupar formulário por assunto -->
        <fieldset>
            <legend>Dados pessoais</legend>
            <div>
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" minlength="5" maxlength="20" required>
            </div>
            <div>
                <label for="email">Email: </label>
                <input type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div>
                <label for="tel">Telefone: </label>
                <input type="tel" name="tel" id="tel" autocomplete="tel" pattern="^[0-9]{4, 5}-[0-9]{4}$"  required>
            </div>
            <!-- RegEx: Expresões regulares -->
            <div>
        </fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>
    </form>
</body>
</html>
